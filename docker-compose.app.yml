# Optional API + workers. Use with docker-compose.yml; shared local storage is required.
services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "3333:3333"
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: http://ollama:11434
      INGESTION_WORKER_IN_API: 'false'
      DATABASE_PATH: /app/data/database.sqlite
      PDF_DIR: /app/data/pdfs
    volumes:
      - ./data:/app/data
    networks: [rag-network]
    depends_on: [qdrant, ollama]
  worker:
    build: .
    restart: unless-stopped
    command: ["npm", "run", "worker"]
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: http://ollama:11434
      DATABASE_PATH: /app/data/database.sqlite
      PDF_DIR: /app/data/pdfs
    volumes:
      - ./data:/app/data
    networks: [rag-network]
    depends_on: [qdrant, ollama]
