version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_visa
    restart: always
    ports:
      - "6333:6333" # API REST e Dashboard Web
      - "6334:6334" # Interface gRPC
    volumes:
      - ./qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__ENABLE_STATIC_CONTENT=true
    networks:
      - rag-network

  ollama:
    image: ollama/ollama:latest
    container_name: ollama_visa
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
    networks:
      - rag-network

volumes:
  ollama_storage:

networks:
  rag-network:
    driver: bridge