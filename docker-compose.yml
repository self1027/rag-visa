services:
  embeddings:
    profiles: [embeddinggemma]
    build:
      context: .
      dockerfile: Dockerfile.embeddings
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12.15-slim@sha256:cb33f7f771ecec2ef1225cf39b159591a040391bd73e4c01f00fdfc4c47611d2}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${EMBEDDING_PORT:-8001}:${EMBEDDING_PORT:-8001}"
    environment:
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-tardellirs/embeddinggemma-pt-br}
      EMBEDDING_REVISION: ${EMBEDDING_REVISION:-e7d1031ee97db28c3e6f87d309cca552e1481622}
      EMBEDDING_MODEL_PATH: /models
      EMBEDDING_MODELS: ${EMBEDDING_MODELS:-[]}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      EMBEDDING_CONTEXT_TOKENS: ${EMBEDDING_CONTEXT_TOKENS:-2048}
      EMBEDDING_BIND_HOST: 0.0.0.0
      EMBEDDING_PORT: ${EMBEDDING_PORT:-8001}
      EMBEDDING_MAX_BODY_BYTES: ${EMBEDDING_MAX_BODY_BYTES:-65536}
      LOCAL_MODEL_THREADS: ${LOCAL_MODEL_THREADS:-2}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-120000}
    volumes:
      - ${EMBEDDING_MODEL_PATH:-./data/models/embeddinggemma-pt-br}:/models:ro
      - ${BERTIMBAU_MODEL_PATH:-./data/models/bert-base-portuguese-cased}:/local-models/bert-base-portuguese-cased:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ['EMBEDDING_PORT'] + '/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 5
    networks: [rag-network]

  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.19.1@sha256:12364fe851b9f17356fc88189fc06d1b521262e04659ec7345975b00c9246a10}
    restart: always
    ports:
      - "6333:6333" # API REST e Dashboard Web
      - "6334:6334" # Interface gRPC
    volumes:
      - ./qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__ENABLE_STATIC_CONTENT=true
    networks:
      - rag-network

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.34.3@sha256:7ab595e4ead391f6818c7215297781282babe0701f6d9a9f8862ac591360a58b}
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
    networks:
      - rag-network

volumes:
  ollama_storage:

networks:
  rag-network:
    driver: bridge
